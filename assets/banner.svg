<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="FraudLens">
  <title>FraudLens</title>
  <defs>
    <linearGradient id="fl-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4d9eff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4d9eff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4d9eff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fl-clip"><rect width="520" height="230" rx="16"/></clipPath>
    <style>
      @font-face {
        font-family:'FLSans'; font-style:normal; font-weight:600;
        src:url(data:font/woff;base64,) format('woff');
      }
      .fl-mono { font-family:'Courier New',Consolas,monospace; font-size:9.5px; letter-spacing:0.8px; fill:#7d8387; }
      .fl-sans { font-family:'FLSans',Archivo,'Segoe UI',Arial,sans-serif; }

      @keyframes fl-sweep { 0%{ transform:translateX(-620px) } 100%{ transform:translateX(620px) } }
      @keyframes fl-lift  { 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
      @keyframes fl-blink { 0%,49%{ opacity:1 } 50%,100%{ opacity:0 } }

      #fl-sweep1 { animation: fl-sweep 6s linear infinite; }
      .fl-tag  { animation: fl-lift 5s ease-in-out infinite; }
      #fl-t2 { animation-delay:.6s } #fl-t3 { animation-delay:1.2s }
      #fl-t4 { animation-delay:1.8s } #fl-t5 { animation-delay:2.4s } #fl-t6 { animation-delay:3s }
      #fl-cur { animation: fl-blink 1.1s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#fl-clip)">
    <rect width="520" height="230" fill="#0e1215"/>
    <rect id="fl-sweep1" x="-160" y="0" width="160" height="230" fill="url(#fl-scan)"/>

    <g class="fl-mono">
      <text class="fl-tag" id="fl-t1" x="20" y="28">TRAINED ON EMSCAD &#183; 17,880 POSTINGS</text>
      <text class="fl-tag" id="fl-t2" x="20" y="42">LINEARSVC &#183; TF-IDF &#183; SHAP</text>
      <text class="fl-tag" id="fl-t3" x="20" y="56">BINARY CLASSIFIER &#183; FAKE/REAL</text>
      <text class="fl-tag" id="fl-t4" x="500" y="28" text-anchor="end">NLP &#183; EXPLAINABLE_ML</text>
      <text class="fl-tag" id="fl-t5" x="20"  y="210">MADE FOR JOB SEEKERS</text>
      <text class="fl-tag" id="fl-t6" x="500" y="196" text-anchor="end">SCAM DETECTION ENGINE</text>
      <text x="500" y="210" text-anchor="end" fill="#5b6470">v1.0</text>
    </g>

    <text class="fl-sans" x="260" y="132" text-anchor="middle" font-size="40" font-weight="600"
          letter-spacing="3" fill="#d9e1e6">FRAUDLENS</text>
    <rect id="fl-cur" x="400" y="103" width="4" height="32" fill="#4d9eff"/>

    <text class="fl-sans" x="260" y="158" text-anchor="middle" font-size="11.5" fill="#9aa3ad">
      An explainable ML system for job scam detection
    </text>
  </g>
  <rect x="1" y="1" width="518" height="228" rx="15" fill="none" stroke="#e8e8e8" stroke-opacity="0.85" stroke-width="2"/>
</svg>
